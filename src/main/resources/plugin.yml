name: BlockStock
version: '${version}'
main: cn.blockeco.exchange.BlockecoPlugin
api-version: '1.21'
softdepend: [Vault, VaultUnlocked, GriefPrevention, Lands, LandsFree, Residence, QuickShop-Hikari, QuickShop, Shopkeepers]
commands:
  company:
    description: 管理 BlockStock 公司
    usage: /company <create|info|asset bind|ipo <announce|subscribe|list|info>|recovery>
  stockadmin:
    description: 管理 BlockStock 运行时配置
    usage: /stockadmin config [min-capital <金额>]|recovery cash|reconcile|bluechip <init|pause|resume|fund|event>
  stock:
    description: 打开 BlockStock 原版交易所，或查询公开股票与 IPO
    usage: /stock [gui|help|market|ipo|info|announcements|subscribe|cash|deposit|withdraw|buy|sell|cancel|portfolio|orders|trades|book]
permissions:
  blockeco.player:
    description: 'BlockStock 玩家权限'
    children:
      blockeco.company.create: true
      blockeco.company.info: true
      blockeco.company.asset.bind: true
      blockeco.company.ipo.announce: true
      blockeco.company.ipo.subscribe: true
      blockeco.stock.subscribe: true
      blockeco.stock.cash: true
      blockeco.stock.trade: true
      blockeco.stock.portfolio: true
      blockeco.stock.orders: true
      blockeco.stock.trades: true
  blockeco.admin:
    description: 'BlockStock 管理员权限'
    children:
      blockeco.admin.recovery: true
      blockeco.admin.bluechip: true
  blockeco.company.create:
    default: true
  blockeco.company.info:
    default: true
  blockeco.company.asset.bind:
    default: true
  blockeco.company.ipo.announce:
    default: true
  blockeco.company.ipo.subscribe:
    default: true
  blockeco.stock.subscribe:
    description: '认购公开 IPO'
    default: true
  blockeco.stock.cash:
    description: '查看和转入/转出证券账户资金'
    default: true
  blockeco.stock.trade:
    description: '提交和撤销股票委托'
    default: true
  blockeco.stock.portfolio:
    description: '查看自己的证券持仓'
    default: true
  blockeco.stock.orders:
    description: '查看自己的委托'
    default: true
  blockeco.stock.trades:
    description: '查看自己的成交'
    default: true
  blockeco.admin.recovery:
    default: op
  blockeco.admin.bluechip:
    description: '管理系统蓝筹市场、资金与模拟事件'
    default: op
  blockstock.admin.config:
    default: op
